<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      padding: 20px;
    }
    
    .message-container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      text-align: center;
    }
    
    .header {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }
    
    .header-text {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      letter-spacing: 1px;
    }
    
    .message {
      font-size: 18px;
      color: #555;
      line-height: 1.8;
      background-color: #f9f9f9;
      padding: 25px;
      border-radius: 8px;
      border-left: 4px solid #2a5298;
    }
    
    .icon {
      font-size: 48px;
      margin-bottom: 20px;
      color: #2a5298;
    }
    
    .message-image {
      max-width: 100%;
      max-height: 400px;
      margin-top: 30px;
      border-radius: 8px;
      display: none;
    }
    
    .message-image.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="message-container">
    <div class="icon">✉️</div>
    <div class="header">
      <div class="header-text">PAYPAL Transaction Message</div>
    </div>
    <div class="message" id="message">Loading...</div>
    <img id="messageImage" class="message-image" alt="Message image">
  </div>
  
  <script>
    // Get link_id from URL path
    const pathParts = window.location.pathname.split('/');
    const linkId = pathParts[2] || '1';
    
    const apiUrl = linkId === '1' ? '/api/settings' : `/api/settings?link_id=${linkId}`;
    const imageUrl = linkId === '1' ? '/api/image' : `/api/image?link_id=${linkId}`;
    
    fetch(apiUrl)
      .then(response => response.json())
      .then(data => {
        document.getElementById('message').textContent = data.message;
        
        // Load image if exists
        if (data.has_image) {
          const imageElement = document.getElementById('messageImage');
          imageElement.src = imageUrl;
          imageElement.classList.add('show');
        }
      })
      .catch(error => {
        console.error('Error fetching message:', error);
        document.getElementById('message').textContent = 'Please wait, we\'ll get back to you shortly.';
      });
  </script>
</body>
</html>
