<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f5f5f5;
    }
    
    .paypal-logo {
      width: 120px;
      height: auto;
      margin-bottom: 20px;
    }
    
    .paypal-text {
      font-size: 32px;
      font-weight: bold;
      color: #333;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #ddd;
      border-top: 4px solid #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal Logo" class="paypal-logo">
  <div class="spinner"></div>
  
  <script>
    // Get link_id from URL path
    const pathParts = window.location.pathname.split('/');
    const linkId = pathParts[2] || '1';
    
    const apiUrl = linkId === '1' ? '/api/settings' : `/api/settings?link_id=${linkId}`;
    const messageUrl = linkId === '1' ? '/message' : `/link/${linkId}/message`;
    
    fetch(apiUrl)
      .then(response => response.json())
      .then(data => {
        const duration = data.loading_duration * 1000;
        setTimeout(() => {
          window.location.href = messageUrl;
        }, duration);
      })
      .catch(error => {
        console.error('Error fetching settings:', error);
        setTimeout(() => {
          window.location.href = messageUrl;
        }, 15000);
      });
  </script>
</body>
</html>
